<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
    <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-entity
        position="0 0 0"

        animation__jump="property: position; from: 0 0 0; to: 0 2 0; dur: 2000; dir: alternate; loop: true; easing: easeInOutSine"

        animation__spin="property: rotation; from: 0 0 0; to: 0 45 0; dur: 6000; loop: true; easing: linear">

        <a-sphere position="0 2.75 -5" radius="1.25" scale=".5 .5 .5" color="green"></a-sphere>
        <a-sphere position="0 3.55 -5" radius="1.25" scale=".25 .250 .25" color="red "></a-sphere>
        <a-sphere position="0 1.25 -5" radius="1.25" color="white"></a-sphere>
       
</a-cone>
      </a-entity>
      <!-- <a-sky color="#ECECEC"></a-sky> -->
      <!-- the enviroment entity includes a sky. Choose from the presets"none, default, contact, egypt, checkerboard, forest, goaland, yavapai, goldmine, threetowers, poison, arches, tron, japan, dream, volcano, starry, osiris, moon" -->
      <a-entity environment="preset: threetowers; dressingAmount: 20"></a-entity>
    </a-scene>
  </body>
</html>
